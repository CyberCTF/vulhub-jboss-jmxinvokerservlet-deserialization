# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# JBoss JMXInvokerServlet Deserialization RCE (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's jboss/JMXInvokerServlet-deserialization, vendored in app/, run from the published image vulhub/jboss:as-6.1.0.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-jboss-jmxinvokerservlet-deserialization

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.41.0/24, internet: false}

machines:
  jboss:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8080
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      image: vulhub/jboss:as-6.1.0

checks:
  - name: JBoss answers
    http: http://jboss:8080/
    wait: 300
  - name: the HTTP invoker servlet is deployed
    script: checks/invoker.sh
    wait: 120

message: |
  JBoss AS 6.1.0 answers at {{ machines.jboss.ports.web.url }}.
  What does /invoker/JMXInvokerServlet expect in a request body?
